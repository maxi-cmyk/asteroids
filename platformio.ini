; ESP32 Asteroids — PlatformIO Configuration
[platformio]
; The handheld's own code is in firmware/; the game it shares with the web build is in engine/.
src_dir = firmware

[env:esp32dev]
; Pinned to arduino-esp32 2.0.x: sound.cpp uses the 2.x LEDC API (ledcSetup/ledcAttachPin),
; which the 3.x core removed.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Libraries
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

; The shared game: headers on the include path, sources added to the build
build_flags = -I engine/include
build_src_filter =
    +<*>
    +<../engine/src/>
    +<../engine/core/>

; Faster flash
board_build.flash_mode = dio
board_build.f_flash = 80000000L